<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="#09090b">
    <defs>
      <linearGradient id="bg3" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0a0a0c"/>
        <stop offset="100%" stop-color="#141416"/>
      </linearGradient>
    </defs>
    <rect width="800" height="500" fill="url(#bg3)"/>
    <rect x="0" y="0" width="800" height="36" fill="#141418"/>
    <circle cx="22" cy="18" r="5" fill="#ef4444"/>
    <circle cx="38" cy="18" r="5" fill="#eab308"/>
    <circle cx="54" cy="18" r="5" fill="#22c55e"/>
    <rect x="80" y="8" width="380" height="20" rx="4" fill="#222228"/>
    <text x="96" y="22" fill="#a1a1aa" font-family="monospace" font-size="11">https://barefootpublishing.uk</text>
    
    <line x1="0" y1="36" x2="800" y2="36" stroke="#27272a" stroke-width="1"/>
    
    <text x="40" y="85" fill="#39FF14" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">// 03 INDEPENDENT PUBLISHING HOUSE</text>
    <text x="40" y="130" fill="#ffffff" font-family="serif" font-size="34" font-weight="700" letter-spacing="1">BAREFOOT PUBLISHING</text>
    <text x="40" y="160" fill="#71717a" font-family="sans-serif" font-size="13">Bespoke Press • Mindful Lifestyle Volumes • Editorial CMS</text>

    <!-- Book Covers / Catalog -->
    <g transform="translate(40, 195)">
      <!-- Book 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="160" height="240" fill="#1c1917" stroke="#44403c" stroke-width="1"/>
        <rect x="12" y="12" width="136" height="216" fill="none" stroke="#78716c" stroke-width="0.5"/>
        <text x="80" y="90" fill="#f5f5f4" font-family="serif" font-size="16" text-anchor="middle" font-weight="bold">THE WAY</text>
        <text x="80" y="112" fill="#d6d3d1" font-family="serif" font-size="12" text-anchor="middle">OF TEA &amp; MIND</text>
        <line x1="50" y1="125" x2="110" y2="125" stroke="#39FF14" stroke-width="1"/>
        <text x="80" y="200" fill="#a8a29e" font-family="monospace" font-size="9" text-anchor="middle">BAREFOOT PRESS</text>
      </g>
      <!-- Book 2 -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="160" height="240" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <rect x="12" y="12" width="136" height="216" fill="none" stroke="#475569" stroke-width="0.5"/>
        <text x="80" y="90" fill="#f8fafc" font-family="serif" font-size="16" text-anchor="middle" font-weight="bold">STILLNESS</text>
        <text x="80" y="112" fill="#cbd5e1" font-family="serif" font-size="12" text-anchor="middle">IN PASSAGE</text>
        <line x1="50" y1="125" x2="110" y2="125" stroke="#39FF14" stroke-width="1"/>
        <text x="80" y="200" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">EASTERN ESSAYS</text>
      </g>
      <!-- Book 3 -->
      <g transform="translate(380, 0)">
        <rect x="0" y="0" width="160" height="240" fill="#141414" stroke="#27272a" stroke-width="1"/>
        <rect x="12" y="12" width="136" height="216" fill="none" stroke="#3f3f46" stroke-width="0.5"/>
        <text x="80" y="90" fill="#fafafa" font-family="serif" font-size="16" text-anchor="middle" font-weight="bold">SILENCE</text>
        <text x="80" y="112" fill="#d4d4d8" font-family="serif" font-size="12" text-anchor="middle">&amp; SOLITUDE</text>
        <line x1="50" y1="125" x2="110" y2="125" stroke="#39FF14" stroke-width="1"/>
        <text x="80" y="200" fill="#71717a" font-family="monospace" font-size="9" text-anchor="middle">LIMITED EDITION</text>
      </g>
    </g>

    <!-- Distribution Badge -->
    <g transform="translate(580, 195)">
      <rect x="0" y="0" width="180" height="70" fill="#141418" stroke="#27272a" stroke-width="1"/>
      <text x="16" y="28" fill="#39FF14" font-family="monospace" font-size="9">GLOBAL DISTRIBUTION</text>
      <text x="16" y="52" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">AMAZON KDP API</text>
      
      <rect x="0" y="85" width="180" height="70" fill="#141418" stroke="#27272a" stroke-width="1"/>
      <text x="16" y="113" fill="#a1a1aa" font-family="monospace" font-size="9">TYPE SPECIMEN</text>
      <text x="16" y="137" fill="#ffffff" font-family="serif" font-size="14" font-style="italic">Bespoke Editorial</text>
    </g>
  </svg>