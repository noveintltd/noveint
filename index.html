<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Nove International | Global Digital Architecture & AI Solutions</title>
    <meta name="description" content="High-performance website development and immersive media design for brands operating without borders.">
    <meta name="keywords" content="Global Digital Architect, AI Voice Integration, SaaS App Development, Multilingual UI/UX, NoveTools">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://noveint.com/">
    <meta property="og:title" content="Nove International | Global Digital Architecture & AI Solutions">
    <meta property="og:description" content="High-performance website development and immersive media design for brands operating without borders.">
    <meta property="og:image" content="https://noveint.com/nove_og_image.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://noveint.com/">
    <meta property="twitter:title" content="Nove International | Global Digital Architecture & AI Solutions">
    <meta property="twitter:description" content="High-performance website development and immersive media design for brands operating without borders.">
    <meta property="twitter:image" content="https://noveint.com/nove_og_image.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="180x180" href="https://noveint.com/nove_int_favicon-180.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://noveint.com/nove_int_favicon-180.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        nav.is-scrolled {
            background-color: rgba(0, 0, 0, 0.95) !important;
            backdrop-filter: blur(10px) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2) !important;
        }

        /* 3D Perspective Grid Floor */
        .perspective-grid {
            position: absolute;
            bottom: -35%;
            left: -50%;
            width: 200%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(57, 255, 20, 0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.12) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(700px) rotateX(65deg);
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 40%, rgba(0,0,0,0) 80%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.5) 40%, rgba(0,0,0,0) 80%);
            z-index: 0;
            pointer-events: none;
        }

        @keyframes fastSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Complex Symbol Breathing */
        @keyframes symbol-complex-glow {
            0%, 100% { 
                filter: drop-shadow(0 0 10px rgba(57, 255, 20, 0.3)) drop-shadow(0 0 30px rgba(57, 255, 20, 0.1));
                opacity: 0.9;
                transform: scale(1);
            }
            50% { 
                filter: drop-shadow(0 0 25px rgba(57, 255, 20, 0.6)) drop-shadow(0 0 80px rgba(57, 255, 20, 0.3));
                opacity: 1;
                transform: scale(1.02);
            }
        }

        /* Full Screen Ripple with Speed Ramp */
        @keyframes ripple-expanded {
            0% { transform: scale(0.2); opacity: 0; border-width: 4px; }
            10% { opacity: 0.3; }
            50% { opacity: 0.1; border-width: 1px; }
            100% { transform: scale(15); opacity: 0; border-width: 0.5px; }
        }

        /* Data Pulse Animation */
        @keyframes data-pulse {
            0% { transform: scale(0.5); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        /* Prism Split Effect on Hover */
        @keyframes prism-split {
            0% { transform: translate(0, 0); opacity: 0.5; filter: blur(2px); }
            50% { transform: translate(4px, -2px); opacity: 0.3; filter: blur(4px); }
            100% { transform: translate(0, 0); opacity: 0.5; filter: blur(2px); }
        }

        .animate-symbol-glow {
            animation: symbol-complex-glow 4s ease-in-out infinite;
        }

        .animate-ripple-advanced {
            animation: ripple-expanded 12s cubic-bezier(0.1, 0.4, 0.2, 1) infinite;
        }

        .animate-prism {
            animation: prism-split 2s ease-in-out infinite;
        }

        .animate-hero-entry {
            animation: fastSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .grid-bg {
            background-image:
                linear-gradient(rgba(57, 255, 20, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.04) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .neon-button {
            border: 1px solid #39FF14;
            color: #39FF14;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .neon-button::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(57, 255, 20, 0.2), transparent);
            transition: 0.5s;
        }

        .neon-button:hover::after {
            left: 100%;
        }

        .neon-button:hover {
            background-color: #39FF14;
            color: #000;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.5);
            transform: translateY(-2px);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #ffffff; }

        /* Scanning HUD marks */
        .hud-mark {
            position: absolute;
            width: 10px;
            height: 1px;
            background: rgba(57, 255, 20, 0.3);
        }
    </style>
</head>

<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>

</html>
